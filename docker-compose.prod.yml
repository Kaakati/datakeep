# Database-Ops Production Overlay
#
# Use with base docker-compose.yml:
# docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This overlay:
# - Uses production Dockerfile
# - Sets production environment variables
# - Configures proper resource limits
# - Enables health checks

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - RAILS_ENV=production
      - RAILS_LOG_TO_STDOUT=true
      - RAILS_SERVE_STATIC_FILES=true
    ports:
      - "80:80"
    volumes:
      # Only mount persistent data, not source code
      - database_ops_storage:/rails/storage
      - database_ops_backups:/rails/backups
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/up || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    command: ["./bin/thrust", "./bin/rails", "server"]

  jobs:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - RAILS_ENV=production
      - RAILS_LOG_TO_STDOUT=true
    volumes:
      - database_ops_storage:/rails/storage
      - database_ops_backups:/rails/backups
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    restart: unless-stopped

  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    restart: unless-stopped

  redis:
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped
