# PostgreSQL configuration
#
# DATABASE_URL environment variable takes precedence over this file.
# Set DATABASE_URL=postgresql://user:password@host:port/database
#
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

# Development environment
# Use DATABASE_URL or configure manually below
development:
  <<: *default
  database: database_ops_development
  username: postgres
  password: password
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>

# Test environment
test:
  <<: *default
  database: database_ops_test
  username: postgres
  password: password
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>

# Production uses DATABASE_URL environment variable
production:
  <<: *default
  database: database_ops_production
  username: database_ops
  password: <%= ENV["DATABASE_PASSWORD"] %>
  host: <%= ENV["DATABASE_HOST"] %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
