# Sidekiq configuration
# https://github.com/mperham/sidekiq/wiki/Advanced-Options

:concurrency: <%= ENV.fetch("SIDEKIQ_CONCURRENCY", 25) %>
:timeout: 25

:queues:
  - [critical, 3]
  - [backups, 2]
  - [sync, 2]
  - [restores, 2]
  - [scheduler, 2]
  - [notifications, 2]
  - [maintenance, 1]
  - [default, 1]
  - [low, 1]

# Enable strict argument checking (recommended)
:strict_args_mode: :warn
