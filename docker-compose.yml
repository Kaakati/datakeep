# DataKeep Development Environment
#
# Start with: docker compose up
# For production: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Services:
# - web: Rails application (port 3000)
# - db: PostgreSQL database for the app itself (port 5432)
# - redis: Cache and background job queue (port 6379)

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - RAILS_ENV=development
      - DATABASE_URL=postgresql://postgres:password@db:5432/datakeep_development
      - REDIS_URL=redis://redis:6379/0
      - RAILS_MASTER_KEY=${RAILS_MASTER_KEY}
    volumes:
      # Application code for live reloading
      - .:/rails:cached
      # Persistent storage for backups
      - datakeep_storage:/rails/storage
      - datakeep_backups:/rails/backups
      # Local backup storage - mounts /var/backups so any subdirectory users configure will work
      - local_backups:/var/backups
      # Bundle cache to avoid reinstalling gems
      - bundle_cache:/usr/local/bundle
      # Node modules (if using)
      - node_modules:/rails/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    stdin_open: true
    tty: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: bash -c "rm -f tmp/pids/server.pid && ./bin/rails server -b 0.0.0.0"

  # Background job processor
  jobs:
    build:
      context: .
      dockerfile: Dockerfile.dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - RAILS_ENV=development
      - DATABASE_URL=postgresql://postgres:password@db:5432/datakeep_development
      - REDIS_URL=redis://redis:6379/0
      - RAILS_MASTER_KEY=${RAILS_MASTER_KEY}
    volumes:
      - .:/rails:cached
      - datakeep_storage:/rails/storage
      - datakeep_backups:/rails/backups
      # Local backup storage - shared with web container
      - local_backups:/var/backups
      - bundle_cache:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["bundle", "exec", "sidekiq"]

  # PostgreSQL database for the application
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: datakeep_development
    ports:
      - "5430:5432"
    volumes:
      # PostgreSQL requires mounting at /var/lib/postgresql (not /data subdirectory)
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for caching, Action Cable, and Sidekiq
  redis:
    image: redis:latest
    ports:
      - "6370:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  # PostgreSQL data persistence
  postgres_data:

  # Redis data persistence
  redis_data:

  # Ruby gem cache
  bundle_cache:

  # Node modules (if using JavaScript dependencies)
  node_modules:

  # Application storage (Active Storage, uploaded files)
  datakeep_storage:

  # Backup files storage (for /rails/backups)
  datakeep_backups:

  # Local backup storage (for /var/backups and any subdirectories)
  local_backups:
